name: Build & Release APK

# Publishes a GitHub Release with the built APK whenever you push a version tag
# (e.g. v1.0.0). The landing page's download button points at:
#   releases/latest/download/cdbc-app.apk
# so this workflow renames the built APK to that exact asset name.

on:
  push:
    tags:
      - "v*"
  # Allow manual runs from the Actions tab as well.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Builds a release APK. If you sign in-app via signingConfigs this is
      # ready to ship; otherwise this produces an unsigned release APK.
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      # Locate the generated APK regardless of module/flavor naming.
      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find . -path "*/build/outputs/apk/release/*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No release APK found under build/outputs/apk/release/"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" cdbc-app.apk
          echo "path=cdbc-app.apk" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdbc-app-apk
          path: cdbc-app.apk

      # Attaches the APK to a GitHub Release for the pushed tag. The download
      # button on the site resolves to /releases/latest/download/cdbc-app.apk.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: cdbc-app.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
